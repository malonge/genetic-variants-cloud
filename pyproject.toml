[project]
name = "genetic-variants-cloud"
version = "0.2.0"
description = "Scalable ELT pipeline transforming VCF genetic variant data to Parquet, DuckDB, and dbt Core"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Michael Alonge" },
]
dependencies = [
    "pysam>=0.22.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "dbt-duckdb>=1.7.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==2.8.0",
    "apache-airflow-providers-docker==3.10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]
airflow = [
    "apache-airflow==2.8.0",
    "apache-airflow-providers-docker==3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

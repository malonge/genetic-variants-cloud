name: CI

on:
  push:
    branches: [ main, "cursor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        run: poetry run ruff check src/ tests/

      - name: Run Pytest
        run: poetry run pytest tests/unit/ -v

      - name: Run E2E dbt pipeline verification
        run: |
          mkdir -p data
          poetry run python -m src.tasks.ingest_samples --storage-base-path "data"
          poetry run python -m src.tasks.vcf_to_parquet \
            "https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/variants/1000_Genomes_Project/chm13v2.0/all_samples_3202/1KGP.CHM13v2.0.chr21.recalibrated.snp_indel.pass.vcf.gz" \
            --region "chr21:10000000-10020000" \
            --limit 50 \
            --storage-base-path "data"
          cd dbt_genomics
          poetry run dbt run --profiles-dir .
          poetry run dbt test --profiles-dir .
